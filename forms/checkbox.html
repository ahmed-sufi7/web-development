<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkbox</title>
</head>
<body>
    <form action="server">
        <input type="checkbox" name="age" id="new" value="new">
        <label for="age">18+</label>
        <input type="checkbox" name="age" id="pro" value="pro">
        <label for="age">40+</label>
        <button>submit</button>
        
            <hr>
        <input type="radio" name="fruit" id="fruit" value="apple">
        <label for="fruit">Apple</label>
        <input type="radio" name="fruit" id="banana" value="banana">
        <label for="banana">Banana</label>
         <input type="radio" name="fruit" id="mango" value="mango">
        <label for="mango">mango</label>   
        <hr>
        <input type="range" name="vol" id="vol" min="0" max="100" step="10" value="70">
        <label for="vol"></label>
        <hr>
        <label for="feedack">Please enter your feedabck:</label>
        <textarea name="feedback" id="feedack" rows="5" cols="100"></textarea>
        <button>submit</button>    
    </form>
   

</body>
</html>
